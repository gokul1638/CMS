spring.application.name=cloud-management-system
server.port=8081

# ==========================================
# Database — H2 (In-Memory Database)
# ==========================================
spring.datasource.url=jdbc:h2:mem:cmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable SQL script initialization (we use DataLoader instead)
spring.sql.init.mode=never

# H2 Console — enabled for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.root=INFO
logging.level.com.cms.cloudmanagement=DEBUG
