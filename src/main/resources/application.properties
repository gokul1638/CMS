spring.application.name=cloud-management-system
server.port=8081

# ==========================================
# Database — MySQL (External Server)
# Override via environment variables on the server
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://100.53.193.115:3306/CMS_cloud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:cmsuser}
spring.datasource.password=${DB_PASSWORD:Cms@12345}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${DB_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Disable SQL script initialization (we use DataLoader instead)
spring.sql.init.mode=never

# H2 Console — disabled in production (MySQL is used)
spring.h2.console.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.cms.cloudmanagement=DEBUG
