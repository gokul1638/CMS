# ==========================================
# CMS Enterprise — Nginx Configuration
# Frontend: Serves static HTML/CSS/JS
# Backend:  Proxies /api/* to Spring Boot :8081
# ==========================================

server {
    listen 80;
    server_name _;   # Accept any hostname or IP

    # Root directory for static frontend files
    root /var/www/cms;
    index index.html;

    # ----------------------------------------
    # Static Frontend Files
    # ----------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets for performance
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # ----------------------------------------
    # API Proxy — Forward to Spring Boot Backend
    # All /api/* requests go to port 8081
    # ----------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ----------------------------------------
    # Health Check Proxy (Spring Boot actuator)
    # ----------------------------------------
    location /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
    }

    # ----------------------------------------
    # Error Pages
    # ----------------------------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # ----------------------------------------
    # Gzip Compression
    # ----------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
