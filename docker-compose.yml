version: '3.8'

# ============================================================
#  CMS Cloud Management System — Docker Compose (Option B)
#  Use this only if you prefer Docker over the direct deploy.
#  For the recommended Option A (No Docker), run: ./deploy.sh
# ============================================================

services:

  # ── Spring Boot Backend ─────────────────────────────────
  cms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-backend
    ports:
      - "8081:8081"
    environment:
      # External MySQL — already running at 100.53.193.115
      DB_URL: "jdbc:mysql://100.53.193.115:3306/CMS_cloud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: cmsuser
      DB_PASSWORD: Cms@12345
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_DIALECT: org.hibernate.dialect.MySQLDialect
      DB_DDL: update
    networks:
      - cms-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx Frontend ──────────────────────────────────────
  cms-frontend:
    image: nginx:alpine
    container_name: cms-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./frontend/app.js:/usr/share/nginx/html/app.js:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cms-backend:
        condition: service_healthy
    networks:
      - cms-network
    restart: always

networks:
  cms-network:
    driver: bridge

# ── No volumes needed — MySQL is external ──────────────────
